<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Голос зала — чат мероприятия</title>
  <link rel="stylesheet" href="screen.css">
</head>
<body class="stage-view" data-display="chat">
  <main class="stage">
    <aside id="join" aria-labelledby="join-title">
      <div class="eyebrow"><span aria-hidden="true"></span> Чат мероприятия</div>
      <h1 id="join-title">Напишите<br> в чат зала</h1>
      <div class="join-card">
        <img id="qr" src="bot-qr.png" alt="QR-код бота «Голос зала» в MAX" width="360" height="360" hidden>
        <div>
          <p>Откройте бота в MAX, нажмите «Начать» и отправьте сообщение.</p>
          <a id="bot" hidden>Открыть бота ↗</a>
        </div>
      </div>
    </aside>
    <section class="chat" aria-labelledby="chat-title">
      <div class="chat-header">
        <span class="avatar" aria-hidden="true">ГЗ</span>
        <div><h2 id="chat-title">Голос зала</h2><span>Сообщения участников</span></div>
      </div>
      <section id="cloud" aria-label="Сообщения" tabindex="0"></section>
      <p id="hint">Ждём первые сообщения от участников.</p>
    </section>
  </main>
  <footer>
    <div id="controls"><button id="latest">К новым ↓</button></div>
    <div id="displayModes" role="group" aria-label="Режим отображения">
      <button type="button" data-display-mode="chat" aria-pressed="true">Крупный чат</button>
      <button type="button" data-display-mode="qr" aria-pressed="false">Крупный QR</button>
    </div>
    <div id="status" role="status">Подключение…</div>
    <button id="full">На весь экран ⛶</button>
  </footer>
  <div id="reactions" aria-hidden="true"></div>
  <script src="screen.js"></script>
</body>
</html>
